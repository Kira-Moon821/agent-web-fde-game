name: import-project

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle
        run: |
          curl -L --retry 3 -o /tmp/project.zip "https://aka.doubaocdn.com/s/jBjTaEZnVG"
          ls -l /tmp/project.zip

      - name: Extract
        run: |
          mkdir -p /tmp/x
          cd /tmp/x
          unzip -q /tmp/project.zip
          ls -la /tmp/x | head -20

      - name: Commit into repository
        run: |
          rsync -a --exclude '.git' /tmp/x/ ./
          rm -f .github/workflows/import-project.yml
          git config user.name "Kira-Moon821"
          git config user.email "864523000@qq.com"
          git add -A
          git commit -m "import: full project (docs + code + pixel site + FDE deploy)" || echo "nothing to commit"
          git push
